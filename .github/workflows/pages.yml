# The demo page. Its code is in docs/; the film (37 MB) is attached to the "files" release instead of the
# repository, so a clone stays small. This job puts the two together and publishes them with GitHub Pages.
name: Demo page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docs/**, .github/workflows/pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the film from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download files --pattern demo-film.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/demo-film.zip" -d docs/film
          test -f docs/film/film.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
